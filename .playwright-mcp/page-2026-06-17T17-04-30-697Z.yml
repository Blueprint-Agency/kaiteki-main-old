          - heading "MEDIA BUZZ" [level=2] [ref=e85]
          - paragraph [ref=e86]: As a notable name in the aesthetic & health industry, Dr Chen is often asked to contribute to multiple newspaper as a columnist such as The Star (since 2014) and featured in The Edge and Kosmo newspapers. Dr Chen also appeared in mainstream media for interviews especially Astro, TV 1 and NTV 7.
          - paragraph [ref=e87]: Besides media appearances, Premier Clinic is also famous as a go-to clinic for celebrities and high profile figures in Malaysia. We take pride in our patient-doctor confidentiality policies, and your information is taken very seriously. We will not disclose any of your information to a third party.
