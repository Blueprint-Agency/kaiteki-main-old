            - generic [ref=e58]: TRANSCENDING AESTHETIC EXCELLENCE
          - paragraph [ref=e59]: Dr Chen Tai Ho is the Founder of Premier Clinic Malaysia. Dedicated to providing an excellent, quality aesthetic service, Dr Chen founded Premier Clinic in May 2014. Thanks to the ongoing support from our clients, Premier Clinic is now branching out to 5 new locations and recognised as one of the leading aesthetic provider in Malaysia.
          - paragraph [ref=e60]: To date, Premier Clinic is equipped with 8 doctors ready to provide exceptional services to our clients. Premier Clinic transcends the aesthetic services in Malaysia by state-of-the-art machineries and offers a vast range of aesthetic treatments.
          - paragraph [ref=e61]: Dr Chen is no stranger to aesthetic community in Malaysia. Prior to establishing Premier Clinic chain, he founded Mediviron UOA Clinic which ran successfully under his leadership. Today, Premier Clinic stands as one of the Top 3 Aesthetic Clinic in Malaysia. We inspire to provide the best of our services to our clients.
