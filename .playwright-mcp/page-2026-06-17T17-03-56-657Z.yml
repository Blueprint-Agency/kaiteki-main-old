      - generic [ref=e74]:
        - heading "What is Rejuran Healer Treatment?" [level=2] [ref=e75]
        - generic [ref=e76]:
          - paragraph [ref=e77]:
            - img "Rejuran Healer Treatment" [ref=e78]
          - paragraph [ref=e79]: Premier Clinic is proud to introduce our latest skin rejuvenation and skin lightening treatment, known as Rejuran Healer. It is a skin booster injection designed to help with the healing of wounds as well as having an anti-inflammatory effect on your body.
          - paragraph [ref=e80]: The DNA extract in Rejuran Healer is obtained from salmon which promotes significant improvement in skin elasticity, texture and hydration. Rejuran Healer treatment is design to reverses aging by repairing the skin at the cellular level, repairs damaged dermal cells and restore abnormal or aging cells.
          - paragraph [ref=e81]:
            - img "Rejuran Healer Treatment" [ref=e82]
      - generic [ref=e83]:
        - heading "How Does Rejuran Healer Treatment Work?" [level=2] [ref=e84]
        - generic [ref=e85]:
          - paragraph [ref=e86]: The Rejuran Healer skin booster injection is a filler treatment, which is formed by polynucleotides (PN). In a chain, the PN is simply known as DNA. Salmon DNA is used in the Rejuran Healer skin rejuvenation treatment due to its similarity with human DNA. According to researchers, it is compatible with the human body so there will not be an immune response or harmful side effects as a result of this skin booster injection. PDRN is the harvested component from salmon DNA which can help to rejuvenate the skin.
          - paragraph [ref=e87]: A numbing cream or anaesthetic will be applied on your skin, after which your doctor will utilise a very fine needle to administer small doses of Rejuran Healer into your skin. The PN/PDRN will help to improve the metabolic activity in your skin cells, increasing the rate of regeneration of key components on your skin like collagen.
          - paragraph [ref=e88]:
            - img "Rejuran Healer Treatment" [ref=e89]
            - img "Rejuran Healer Treatment" [ref=e90]
          - paragraph [ref=e91]:
            - img "Rejuran Healer Treatment" [ref=e92]
      - generic [ref=e93]:
        - heading "Benefits of Rejuran Healer Treatment" [level=2] [ref=e94]
        - generic [ref=e95]:
          - paragraph [ref=e96]: Aside from the beneficial effects outlined at the beginning of the article, Rejuran Healer can also help to treat problems such as saggy skin, large pores, dark eye circles, dull skin, stretch marks, and even scars caused by acne.
          - paragraph [ref=e97]:
            - strong [ref=e98]: "Rejuran Healer treatment has several beneficial effects on your skin, including:"
          - list [ref=e99]:
            - listitem [ref=e100]: Better elasticity
            - listitem [ref=e101]: Improved texture and skin tone
            - listitem [ref=e102]: Reduced wrinkles and fine lines
            - listitem [ref=e103]: Improved thickness of skin and oil production
            - listitem [ref=e104]: Improved hydration
            - listitem [ref=e105]: Encourage wound healing
            - listitem [ref=e106]: Minimise enlarged pores
            - listitem [ref=e107]: Promotes firmness and smoother skin
          - paragraph [ref=e108]:
            - img "Glutathione Plus Vitamin E Supplement" [ref=e109]
            - img "Crystal Tomato for Beautiful Skin Supplement" [ref=e110]
      - generic [ref=e111]:
        - heading "What Problems Does It Help?" [level=2] [ref=e112]
        - generic [ref=e113]:
          - heading "Aging / Dull Skin" [level=4] [ref=e114]:
            - strong [ref=e115]: Aging / Dull Skin
          - paragraph [ref=e116]: Aging is a process where the human body is developing while maintaining functions ability that enables wellbeing in older age. Skin features will changes either improve or worsen during aging. Commonly without proper care and routine, skin changes will trigger appearances of wrinkles, age spots, dryness and dull skin. Aging also will cause short in collagen and elastin production, which lead to damage and loose skin.
          - paragraph [ref=e117]: Fair skin is a very desirable trait for many individuals and is much sought after, especially among Asians. Individuals may undergo this process for professional or personal reasons, but the desired outcome is the same – a fresh layer of skin in a lighter tone.
          - paragraph [ref=e118]: As Rejuran skin booster injection helps the regeneration of replacement cells, the skin cells that take the place of the old ones are naturally fairer and healthier than the ones before. Skin will no longer be dry as it now retains moisture to remain well hydrated, ensuring your skin is vibrant and glowing. As a result, there will be a natural whitening effect which will be reflected in a fairer skin tone and achieving healthy youthful skin.
          - paragraph [ref=e119]:
            - img "Benefits of Celebre Placenta & Stem Cell" [ref=e120]
          - paragraph [ref=e121]
          - heading "Pores & Texture" [level=4] [ref=e122]:
            - strong [ref=e123]: Pores & Texture
          - paragraph [ref=e124]: Rejuran contains polynucleotide, which helps to stimulate skin regeneration and improve skin laxity. Large pores are products of skin that loses its flexibility, disabling the pores to return to its normal size. Polynucleotide will help the skin to restore its flexibility, which in turn help your pores to become smaller and your skin look more flawless!
      - generic [ref=e125]:
        - heading "Watch How the Procedure is Done" [level=2] [ref=e126]
        - img "Play Video" [ref=e134] [cursor=pointer]
      - generic [ref=e135]:
        - heading "Precautions of Doing Rejuran Healer Treatment" [level=2] [ref=e136]
        - generic [ref=e137]:
          - paragraph [ref=e138]: There is the possibility of very mild side effects like skin redness or swelling, but this will not affect you negatively. In fact, you should be able to return to your daily activities and routine almost immediately after the skin rejuvenation treatment is complete.
          - paragraph [ref=e139]:
            - img "Rejuran Healer Treatment" [ref=e140]
            - img "Rejuran Healer Treatment" [ref=e141]
      - generic [ref=e142]:
        - heading "Side Effects of Rejuran Healer Treatment" [level=2] [ref=e143]
        - paragraph [ref=e145]: There are no known major side effects subject to both procedure and material use in Rejuran healer treatment. Adverse reaction to the material is extremely rare.
      - generic [ref=e146]:
        - heading "Expected downtime for Rejuran Healer treatment" [level=2] [ref=e147]
        - generic [ref=e148]:
          - paragraph [ref=e149]: Downtime for Rejuran Healer is minimal where patients can return to their daily life after the treatment. Results should be visible within four weeks or so, as this is the time needed for the skin healing process to take place. Depending on your condition, it is suitable to schedule multiple sessions about three weeks apart, but this will be discussed with you prior to treatment. The lifting may be gradual and progressive.
          - paragraph [ref=e150]:
            - img "Rejuran Healer Treatment" [ref=e151]
      - generic [ref=e152]:
        - heading "How Much Does It Cost?" [level=2] [ref=e153]
        - generic [ref=e154]:
          - paragraph [ref=e155]: Skin whitening treatment in Malaysia is also known as baby skin injections as it promotes skin natural healing, repair acne damage and regenerates skin cells from deep within. Rejuran Healer treatment is administered through the straightforward injectable procedure. It comes with a syringe which cost around RM 2,200 to Rm 4,000 for 1cc.
          - paragraph [ref=e156]: The number of sessions needed as well as amount of injection requires may only be determined or diagnosed by the doctors. Here in Premier Clinic, the price for Rejuran Healer treatment is about RM 2,500/ syringe. Compare to the other types of treatment, Rejuran Healer provides a safe treatment with no permanent side effects.
          - paragraph [ref=e157]:
            - img "Rejuran Healer Treatment" [ref=e158]
